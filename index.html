      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <title>Data Kelas 10 RPL 1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #f0f2f5;
        color: #333;
      }

      header {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: white;
        text-align: center;
        padding: 40px 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      header p {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .grid-wrapper {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
      }

      .student-card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        transition: transform 0.3s, box-shadow 0.3s;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        border-top: 5px solid #2a5298;
      }

      .student-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
      }

      .card-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #f0f2f5;
        margin-bottom: 15px;
      }

      .student-name {
        font-size: 1.25rem;
        font-weight: 700;
        color: #1e3c72;
        margin-bottom: 5px;
      }

      .student-role {
        display: inline-block;
        background-color: #e3f2fd;
        color: #1565c0;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .click-hint {
        margin-top: 15px;
        font-size: 0.8rem;
        color: #888;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        padding: 20px;
      }

      .modal-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      .modal-content {
        background: white;
        width: 100%;
        max-width: 500px;
        border-radius: 15px;
        overflow: hidden;
        transform: scale(0.7);
        transition: transform 0.3s ease;
        position: relative;
      }

      .modal-overlay.active .modal-content {
        transform: scale(1);
      }

      .modal-header {
        background: #2a5298;
        padding: 20px;
        text-align: center;
        color: white;
        position: relative;
      }

      .close-btn {
        position: absolute;
        top: 15px;
        right: 15px;
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        line-height: 35px;
      }

      .close-btn:hover {
        background: rgba(255, 255, 255, 0.4);
      }

      .modal-img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 4px solid white;
        object-fit: cover;
        margin-bottom: 10px;
      }

      .modal-body {
        padding: 25px;
      }

      .info-group {
        margin-bottom: 15px;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
      }

      .info-group:last-child {
        border-bottom: none;
      }

      .info-label {
        font-weight: bold;
        color: #555;
        display: block;
        margin-bottom: 5px;
      }

      .info-value {
        color: #333;
        font-size: 1rem;
      }

      .skill-badge {
        display: inline-block;
        background: #2a5298;
        color: white;
        padding: 3px 10px;
        border-radius: 4px;
        font-size: 0.85rem;
        margin-right: 5px;
        margin-bottom: 5px;
      }

      @media (max-width: 600px) {
        header h1 {
          font-size: 2rem;
        }
        .modal-content {
          width: 95%;
        }
      }
      .socialIcons {
        display: flex;
        justify-content: center;
        width: 100%;
      }
      .socialIcons a {
        text-decoration: none;
        padding: 10px;
        background-color: rgb(252, 252, 252);
        margin: 10px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .socialIcons a i {
        font-size: 2.3em;
        color: #0f0f10;
        opacity: 0.9;
      }

      .socialIcons a:hover {
        background-color: #504f59;
        transition: 0.5s;
      }
      .socialIcons a:hover i {
        color: white;
        transition: 0.5s;
      }
      @media (max-width: 700px) {
        .footerNav ul {
          flex-direction: column;
        }
        .footerNav ul li {
          width: 100%;
          text-align: center;
          margin: 10px;
        }
        .socialIcons a {
          padding: 8px;
          margin: 4px;
        }
      }

      footer {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        text-align: center;
        padding: 20px;
        width: 100%;
      }
    </style>
  </head>

      const gridContainer = document.getElementById("student-grid");
      const modal = document.getElementById("modal");

      function renderCards() {
        gridContainer.innerHTML = "";
        students.forEach((student, index) => {
          const card = document.createElement("div");
          card.className = "student-card";
          card.onclick = () => openModal(index);

          card.innerHTML = `
                    <img src="${student.photo}" alt="${student.name}" class="card-avatar">
                    <div class="student-name">${student.name}</div>
                    <div class="student-role">${student.role}</div>
                    <div class="click-hint">Klik untuk detail</div>
                `;
          gridContainer.appendChild(card);
        });
      }

      function openModal(index) {
        const data = students[index];

        document.getElementById("modal-img").src = data.photo;
        document.getElementById("modal-name").innerText = data.name;
        document.getElementById("modal-role").innerText = data.role;
        document.getElementById("modal-address").innerText = data.address;
        document.getElementById("modal-hobby").innerText = data.hobby;

        const skillsContainer = document.getElementById("modal-skills");
        skillsContainer.innerHTML = "";
        data.skills.forEach((skill) => {
          const badge = document.createElement("span");
          badge.className = "skill-badge";
          badge.innerText = skill;
          skillsContainer.appendChild(badge);
        });

        modal.classList.add("active");
      }

      function closeModal() {
        modal.classList.remove("active");
      }

      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
